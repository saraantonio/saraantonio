<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Invitation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="section envelope-section">
    <div class="envelope-wrapper">
    <div class="envelope" onclick="openEnvelope()">

      <img src="media/envelope-back.png" class="envelope-body">
      <img src="media/envelope-flap.png" class="envelope-flap" id="flap">


    </div>
  </div>
</section>

<section class="section fade">
  <h1>[Bride Name] & [Groom Name]</h1>
  <p class="subtitle">are getting married</p>
  <p class="details">
    Saturday, 12 July 2026<br>
    17:00<br><br>
    Villa Aurelia<br>
    Rome, Italy
  </p>
</section>

<section class="section fade">
  <h2>Wedding Policies</h2>
  <p>
    Elegant dress code<br>
    Adults-only celebration<br>
    Ceremony followed by dinner
  </p>
</section>

<section class="section fade">
  <h2>Schedule</h2>
  <p>
    17:00 Ceremony<br>
    18:30 Cocktail Hour<br>
    20:00 Dinner<br>
    22:00 Party
  </p>
</section>

<section class="section fade rsvp">
  <h2>RSVP</h2>
<form id="rsvp-form">
  <input type="text" name="name" placeholder="Full Name" required>

  <select name="attendance" required>
    <option value="">Will you attend?</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <button type="submit">Submit</button>
  <p id="success"></p>
</form>
</section>

<script src="js/script.js"></script>
</body>
</html>
