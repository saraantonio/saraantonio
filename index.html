<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Invitation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="section envelope-section">
    <div class="envelope-wrapper">
    <div class="envelope" onclick="openEnvelope()">

      <img src="media/envelope-back.png" class="envelope-body">
      <img src="media/envelope-flap.png" class="envelope-flap" id="flap">


    </div>
  </div>
</section>

<section class="section fade">
  <h1>Сара & Антонио</h1>
  <p class="subtitle">се венчаваат</p>
  <p class="details">
    Сабота, 12 Јули 2026<br>
    17:00<br><br>
    Villa Aurelia<br>
    Рим, Италија
  </p>
</section>

<section class="section fade">
  <h2>Правила за свадбата</h2>
  <p>
    Елегантен дрес код<br>
    Само за возрасни<br>
    Церемонија со вечера
  </p>
</section>

<section class="section fade">
  <h2>Распоред</h2>
  <p>
    17:00 Церемонија<br>
    18:30 Коктел час<br>
    20:00 Вечера<br>
    22:00 Забава
  </p>
</section>

<section class="section fade rsvp">
  <h2>Потврда</h2>
<form id="rsvp-form">
  <input type="text" name="name" placeholder="Полно име" required>

  <select name="attendance" required>
    <option value="">Ќе присуствувате?</option>
    <option value="Yes">Да</option>
    <option value="No">Не</option>
  </select>

  <button type="submit">Испрати</button>
  <p id="success"></p>
</form>
</section>

<script src="js/script.js"></script>
</body>
</html>
